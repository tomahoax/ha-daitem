arm_groups:
  name: Arm groups
  description: Arm or disarm specific Daitem alarm groups simultaneously.
  fields:
    groups:
      name: Groups
      description: List of numeric group IDs to control (e.g. [1, 2]).
      required: true
      example: [1, 2]
      selector:
        object:
    active:
      name: Active
      description: Whether to arm (true) or disarm (false) the specified groups.
      required: false
      default: true
      selector:
        boolean:
    entity_id:
      name: Target Entity
      description: Specific Daitem alarm panel entity to target (optional if only one installation).
      required: false
      selector:
        entity:
          domain: alarm_control_panel
          integration: daitem
