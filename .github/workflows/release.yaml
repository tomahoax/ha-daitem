# Release workflow for HACS.
#
# HACS ships the contents of custom_components/daitem from GitHub releases. Pushing a
# `vX.Y.Z` tag runs the checks, builds the archive, and creates the release with the notes
# taken from CHANGELOG.md, so the release body and the changelog cannot drift apart.
#
# Ordering matters: publish the matching pydaitem version to PyPI first, otherwise
# installation fails for users because Home Assistant cannot find the dependency pinned in
# the manifest.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: home-assistant/actions/hassfest@master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements_dev.txt

      - name: Ruff
        run: |
          ruff check custom_components tests
          ruff format --check custom_components tests

      - name: Mypy
        run: mypy custom_components

      - name: Pytest
        run: pytest

      # HACS validation deliberately runs in validate.yaml rather than here: it currently
      # fails on the missing brand assets, and that must not block shipping a fix. Move it
      # into this job once icons are in place.

  release:
    name: Create the release
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: write # required to create the release and attach the archive
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Run this workflow from a vX.Y.Z tag, not from ${GITHUB_REF}."
            exit 1
          fi
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Check the manifest version matches the tag
        run: |
          MANIFEST=$(jq -r .version custom_components/daitem/manifest.json)
          if [ "${{ steps.version.outputs.version }}" != "$MANIFEST" ]; then
            echo "::error::Manifest version ($MANIFEST) differs from tag (${{ steps.version.outputs.version }})."
            exit 1
          fi
          echo "OK: manifest and tag both say $MANIFEST"

      - name: Report the pinned dependency
        run: |
          jq -r '.requirements[]' custom_components/daitem/manifest.json \
            | sed 's/^/Required PyPI dependency: /'

      - name: Extract the release notes from the changelog
        run: |
          python - <<'PY'
          import pathlib, re, sys

          version = "${{ steps.version.outputs.version }}"
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Everything between this version's heading and the next one.
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              changelog,
              re.DOTALL | re.MULTILINE,
          )
          if match is None:
              print(f"::error::CHANGELOG.md has no '## [{version}]' section.")
              sys.exit(1)
          pathlib.Path("RELEASE_NOTES.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
          print(match.group(1).strip())
          PY

      - name: Build the archive
        run: |
          cd custom_components/daitem
          zip -r ../../daitem.zip . -x '*/__pycache__/*' '*.pyc'

      - name: Create the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: daitem.zip
