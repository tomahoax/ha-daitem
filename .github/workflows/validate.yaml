name: Validation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Hassfest tracks Home Assistant changes: a weekly run surfaces deprecations before
    # they break the integration for users.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# None of these jobs need to write anything back to the repository.
permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deliberately not pinned to a release or a commit SHA, unlike the rest of this
      # file's third-party actions: hassfest is meant to be run against whatever Home
      # Assistant currently validates against, which is exactly what the weekly schedule
      # above exists to catch. Home Assistant's own docs recommend `@master` for this
      # reason.
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same reasoning as hassfest above: HACS's own validation docs recommend tracking
      # `@main` rather than pinning, so this job catches HACS's own rule changes too.
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements_dev.txt
      - name: Ruff
        run: |
          ruff check custom_components tests
          ruff format --check custom_components tests
      - name: Mypy
        run: mypy custom_components

  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Home Assistant requires Python 3.14.2+ starting with its own 2026.3.0 release, so
      # this cannot be a range the way it used to be: the declared minimum (see
      # CHANGELOG.md) simply does not install on 3.12 or 3.13.
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements_dev.txt
      - name: Pytest
        run: pytest --cov=custom_components/daitem --cov-report=term-missing
